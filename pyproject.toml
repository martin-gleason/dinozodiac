[project]
name = "dinozodiac"
version = "0.2.0"
description = "Scrape daily horoscopes and remix them into dinosaur-based horoscopes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "sqlalchemy>=2.0",
]

[project.scripts]
dinozodiac = "dinozodiac.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 88
src = ["src", "tests/python"]

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle, I: import sorting, UP: modern syntax,
# B: likely bugs, SIM: simplifications, N: naming (snake_case)
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
